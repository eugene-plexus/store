[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eugene-plexus-store"
version = "0.1.0"
description = "The store for Eugene Plexus: what the gateway's OpenAI- and Anthropic-compatible doors keep for people (files and uploads first), each object with one owner and an end."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Eugene Plexus contributors" },
]
keywords = ["eugene-plexus", "llm", "openai", "files", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Every one of these is already in the install's lock (the agent, the
# gateway and the library use them), so adding this component adds no
# package to an install. SQLite is the standard library's. This
# component is installed into the agent's environment, which is what
# the supervisor spawns it with.
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-pyyaml>=6,<7",
    "datamodel-code-generator==0.80.0",
]

[project.scripts]
eugene-plexus-store = "eugene_plexus_store.__main__:main"

[project.urls]
Homepage = "https://github.com/eugene-plexus"
Repository = "https://github.com/eugene-plexus/store"
Specs = "https://github.com/eugene-plexus/specs"

[tool.hatch.build.targets.wheel]
packages = ["src/eugene_plexus_store"]

# -----------------------------------------------------------------------------
# Ruff (linter + formatter)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "src/eugene_plexus_store/_generated",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "ASYNC",         # async-correctness
    "SIM",           # simplifications
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# FastAPI's dependency injection is a function call in an argument default.
"src/eugene_plexus_store/dependencies.py" = ["B008"]
"src/eugene_plexus_store/routes/*.py" = ["B008"]

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# call-arg is disabled because mypy doesn't recognize pydantic's
# `field: T = Field(default, ...)` defaults — every optional codegen'd
# Pydantic field is reported as missing at the call site otherwise.
disable_error_code = ["call-arg"]
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "src/eugene_plexus_store/_generated",
]

[[tool.mypy.overrides]]
module = "eugene_plexus_store._generated.*"
ignore_errors = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
